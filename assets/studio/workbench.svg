<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-label="Currently building: my GitHub developer studio. Areas of interest: web development, privacy-aware networking and practical automation."><title>Currently building: my GitHub developer studio. Areas of interest: web development, privacy-aware networking and practical automation.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172443"/><stop offset=".55" stop-color="#10192e"/><stop offset="1" stop-color="#101629"/></linearGradient><linearGradient id="neon"><stop stop-color="#55e5ed"/><stop offset=".52" stop-color="#a28bff"/><stop offset="1" stop-color="#ef8acb"/></linearGradient><radialGradient id="halo"><stop stop-color="#8160ec" stop-opacity=".45"/><stop offset="1" stop-color="#8160ec" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#809bd0" opacity=".16"/></pattern></defs><rect x="1" y="1" width="1118" height="348" rx="23" fill="url(#bg)" stroke="#374767"/><rect x="1" y="1" width="1118" height="348" rx="23" fill="url(#dots)"/><path d="M25 1H1095" stroke="url(#neon)" stroke-width="2" opacity=".8"/><text x="38" y="43" fill="#b5a0ff" font-family="monospace" font-size="12" font-weight="600">ON THE WORKBENCH</text><text x="38" y="88" fill="#edf1ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700">Currently building</text><rect x="38" y="115" width="654" height="167" rx="16" fill="#10243a" stroke="#36516b"/><rect x="59" y="134" width="139" height="28" rx="14" fill="#10283b" stroke="#254257"/><text x="73" y="153" fill="#69e5e1" font-family="monospace" font-size="11" font-weight="600">IN PROGRESS</text><text x="59" y="195" fill="#edf1ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700">My GitHub developer studio</text><text x="59" y="230" fill="#b4c6e4" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Custom animations, public project cards</text><text x="59" y="255" fill="#b4c6e4" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">and a daily GitHub activity snapshot.</text><text x="732" y="139" fill="#76e3df" font-family="monospace" font-size="12" font-weight="600">AREAS I EXPLORE</text><text x="732" y="177" fill="#dfe7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Web development</text><text x="732" y="209" fill="#dfe7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Privacy-aware networking</text><text x="732" y="241" fill="#dfe7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400">Practical automation</text><circle cx="1041" cy="64" r="7" fill="#77e5d8"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle><text x="38" y="322" fill="#aabddd" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">The goal: build useful tools and make them easy to understand.</text><style>@media(prefers-reduced-motion:reduce){.moving{animation:none!important}}</style></svg>