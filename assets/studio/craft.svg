<svg xmlns="http://www.w3.org/2000/svg" width="550" height="457" viewBox="0 0 550 457" role="img" aria-label="In the editor — web development, privacy and automation"><title>In the editor — web development, privacy and automation</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172443"/><stop offset=".55" stop-color="#10192e"/><stop offset="1" stop-color="#101629"/></linearGradient><linearGradient id="neon"><stop stop-color="#55e5ed"/><stop offset=".52" stop-color="#a28bff"/><stop offset="1" stop-color="#ef8acb"/></linearGradient><radialGradient id="halo"><stop stop-color="#8160ec" stop-opacity=".45"/><stop offset="1" stop-color="#8160ec" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#809bd0" opacity=".16"/></pattern></defs><rect x="1" y="1" width="548" height="455" rx="23" fill="url(#bg)" stroke="#374767"/><rect x="1" y="1" width="548" height="455" rx="23" fill="url(#dots)"/><path d="M25 1H525" stroke="url(#neon)" stroke-width="2" opacity=".8"/><text x="30" y="43" fill="#79e6e5" font-family="monospace" font-size="12" font-weight="600">01 / IN THE EDITOR</text><text x="30" y="82" fill="#edf1ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700">Make the complex feel simple.</text><rect x="30" y="108" width="490" height="195" rx="12" fill="#091426" stroke="#314460"/><circle cx="49" cy="126" r="4" fill="#fa91b7"/><circle cx="64" cy="126" r="4" fill="#eacb84"/><circle cx="79" cy="126" r="4" fill="#7ce3cb"/><text x="50" y="162" fill="#b7a1ff" font-family="monospace" font-size="16" font-weight="400">const idea = understand(problem);</text><text x="50" y="192" fill="#89ddef" font-family="monospace" font-size="16" font-weight="400">const tool = build(idea);</text><text x="50" y="222" fill="#b2c5ef" font-family="monospace" font-size="16" font-weight="400">test(tool);</text><text x="50" y="252" fill="#f3b7d4" font-family="monospace" font-size="16" font-weight="400">improve(tool);</text><rect x="199" y="237" width="9" height="17" fill="#89ddef"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect><text x="30" y="340" fill="#8fa5cf" font-family="monospace" font-size="12" font-weight="600">WEB DEVELOPMENT</text><text x="30" y="367" fill="#dfe7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400">Interfaces, backend services and reliable tools.</text><text x="30" y="403" fill="#8fa5cf" font-family="monospace" font-size="12" font-weight="600">PRIVACY &amp; AUTOMATION</text><text x="30" y="430" fill="#dfe7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400">Secure tunneling. Fewer repetitive tasks.</text><style>@media(prefers-reduced-motion:reduce){.moving{animation:none!important}}</style></svg>