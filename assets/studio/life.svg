"indefinite"/></path></g><text x="30" y="340" fill="#8fa5cf" font-family="monospace" font-size="12" font-weight="600">HIKING / CHESS / NEW IDEAS</text><text x="30" y="369" fill="#dfe7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400">Step outside. Think a few moves ahead.</text><text x="30" y="407" fill="#bdc9e3" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400">Curiosity doesn’t stop when the editor closes.</text><style>@media(prefers-reduced-motion:reduce){.moving{animation:none!important}}</style></svg>